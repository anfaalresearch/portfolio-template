<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal portfolio of Muhammed Anfaal M M — First-year B.Tech student in CS-AI at TKM College of Engineering, Kollam.">
  <meta name="author" content="Muhammed Anfaal M M">
  <title>Muhammed Anfaal M M | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Cursor spotlight -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Ambient background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Hero -->
  <header class="hero reveal">
    <div class="avatar-wrap">
      <img src="avatar.jpg" alt="Muhammed Anfaal M M" class="avatar-img">
      <div class="avatar-ring"></div>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Open to learning &amp; open source
    </div>

    <h1 id="name"></h1>
    <p id="tagline"></p>
    <nav id="links"></nav>
  </header>

  <main>
    <!-- About -->
    <section class="glass-card reveal">
      <div class="section-label">01 &mdash; WHO I AM</div>
      <h2>About Me</h2>
      <p id="bio" class="bio-text"></p>
    </section>

    <!-- Skills -->
    <section class="glass-card reveal">
      <div class="section-label">02 &mdash; TOOLS &amp; TECH</div>
      <h2>Skills</h2>
      <ul id="skills" class="chips"></ul>
    </section>

    <!-- Projects -->
    <section class="reveal">
      <div class="section-label">03 &mdash; WORK</div>
      <h2>Featured Projects</h2>
      <div id="projects" class="grid"></div>
    </section>
  </main>

  <footer class="site-footer reveal">
    <div class="footer-line"></div>
    <div id="footer"></div>
    <p class="footer-sub">Built for FOSSSoC-S1 &bull; TKM College of Engineering</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Cursor glow effect
    const glow = document.getElementById('cursorGlow');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let cx = mx, cy = my;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    (function animate() {
      cx += (mx - cx) * 0.08;
      cy += (my - cy) * 0.08;
      glow.style.transform = `translate(${cx - 200}px, ${cy - 200}px)`;
      requestAnimationFrame(animate);
    })();

    // Scroll reveal
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>

</html>
